[package]
name = "cpx-cua"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
async-trait = "0.1"
cua-driver-core = { path = "../cua-driver-core", default-features = false }
platform-windows = { path = "../platform-windows" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Sip", "Win32_Security_Cryptography_Catalog", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "ApplicationModel", "ApplicationModel_Core", "Management_Deployment", "Storage", "System", "Foundation_Collections"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"
