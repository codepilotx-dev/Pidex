name: CUA runtime

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/native/cpx-cua/**'
      - 'scripts/BuildCua.ts'
      - 'scripts/CuaArtifact.ts'
      - '.github/workflows/cua-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Identify source
        id: source
        shell: pwsh
        run: |
          $tag = bun scripts/CuaArtifact.ts
          if ($LASTEXITCODE -ne 0) { throw 'CUA fingerprint failed' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: apps/desktop/native/cpx-cua -> target
      - name: Build release runtime
        run: bun scripts/BuildCua.ts
      - name: Verify runtime startup
        shell: pwsh
        run: |
          $request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"pidex-ci","version":"1"}}}'
          $response = $request | & apps/desktop/native/cpx-cua/dist/cpx-cua.exe | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $response.result.serverInfo.name -ne 'CPX-CUA') { throw 'CUA startup verification failed' }
      - name: Publish prebuilt runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CUA_TAG: ${{ steps.source.outputs.tag }}
        run: |
          gh release view $env:CUA_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $env:CUA_TAG apps/desktop/native/cpx-cua/dist/cpx-cua.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'CUA Windows x64 runtime' --notes 'Prebuilt CUA runtime identified by source fingerprint.' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'CUA release publication failed' }
