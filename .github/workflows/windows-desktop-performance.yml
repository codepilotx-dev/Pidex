name: Windows desktop performance

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-performance
  cancel-in-progress: true

jobs:
  renderer-observation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Renderer performance observation
        run: bun scripts/performance/RunSuite.ts --suite=renderer
      - name: Upload renderer performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-observation-${{ github.run_attempt }}
          path: performance-results/renderer/
          if-no-files-found: warn
          retention-days: 30

  packaged-electron:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows package
        run: bun run package:win
      - name: Locate packaged executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem release -Recurse -Filter Pidex Desktop.exe |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1
          if (-not $executable) {
            throw "Pidex Desktop.exe was not found in the unpacked package"
          }
          "PIDEX_PERF_EXECUTABLE=$($executable.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Packaged Electron performance
        run: bun run perf:electron
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-performance
          path: performance-results/electron/
          if-no-files-found: warn
          retention-days: 30
