name: Security CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Version consistency check
        run: bun run version:check
      - name: Typecheck
        run: bun run typecheck
      - name: Formatting check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Icon upstream sync check
        run: bun run --cwd packages/material-icon-theme sync:check
      - name: Renderer CSS policy check
        run: bun run desktop:css:check
      - name: Build agent
        run: bun run build:agent
      - name: Build renderer
        run: bun run build:renderer
      - name: Performance statistics tests
        run: bun run test:performance:stats
      - name: Renderer performance observation
        run: bun scripts/performance/RunSuite.ts --suite=renderer
      - name: Upload renderer performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-performance-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: performance-results/renderer/
          if-no-files-found: warn
          retention-days: 14
      - name: Build desktop
        run: bun run build:desktop
      - name: Whitespace check
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base -or $base -match '^0+$') {
            $base = "HEAD^"
          }
          git diff --check "$base...HEAD"

  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run test:unit

  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: High and critical dependency audit
        run: bun run security:audit
