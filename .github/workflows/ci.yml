name: Project CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
      - name: Project quality checks
        if: steps.project.outputs.run == 'true'
        run: bun run typecheck && bun run format:check && bun run lint && bun run --cwd packages/material-icon-theme sync:check && bun run desktop:css:check
      - name: Whitespace check
        if: steps.project.outputs.run == 'true'
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git diff --check "$CI_BASE_SHA" HEAD

  unit-shards:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
      - name: Unit tests
        if: steps.project.outputs.run == 'true'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run test:unit --parallel=4 --shard=${{ matrix.shard }}/4

  unit-tests:
    if: always()
    needs: unit-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard
        env:
          RESULT: ${{ needs.unit-shards.result }}
        run: test "$RESULT" = success

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
      - name: High and critical dependency audit
        if: steps.project.outputs.run == 'true'
        run: bun run security:audit
