name: Windows x64 package

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unsigned-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
      - name: Build unsigned package
        if: steps.project.outputs.run == 'true'
        run: bun run package:win
      - name: Silent install and installed-layout smoke
        if: steps.project.outputs.run == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-installed-win-x64.ps1

  signed-agent-parity:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
          workspace: '@pidex/agent'
      - name: Build Windows x64 agent
        if: steps.project.outputs.run == 'true'
        run: bun run build:agent
      - name: Create isolated release run context
        if: steps.project.outputs.run == 'true'
        id: run-context
        shell: pwsh
        run: |
          bun scripts/ReleaseRunContext.ts create
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the isolated release run context" }
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create synthetic signing certificate
        if: steps.project.outputs.run == 'true'
        id: parity-cert
        shell: pwsh
        timeout-minutes: 10
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Pidex PR Parity (ephemeral)" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable -KeySpec Signature
          $thumbprint = $cert.Thumbprint
          $password = -join ((1..24) | ForEach-Object { [char](Get-Random -Minimum 33 -Maximum 126) })
          $pfxPath = Join-Path $env:PIDEX_RELEASE_RUN_ROOT "parity.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath `
            -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          # 不向用户根存储添加自签证书：Windows 会触发极慢的根验证/自动更新，
          # 签名验证改用 ExtraStore + 链根固定信任锚（见 verify 步骤）。
          "thumbprint=$thumbprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pfx=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "password=$password" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign agent with synthetic certificate
        if: steps.project.outputs.run == 'true'
        shell: pwsh
        env:
          PIDEX_WINDOWS_CERTIFICATE_PATH: ${{ steps.parity-cert.outputs.pfx }}
          PIDEX_WINDOWS_CERTIFICATE_PASSWORD: ${{ steps.parity-cert.outputs.password }}
        run: |
          bun scripts/SignWinAgent.ts
          if ($LASTEXITCODE -ne 0) { throw "Synthetic Authenticode signing failed" }
      - name: Verify signed agent runtime parity
        if: steps.project.outputs.run == 'true'
        shell: pwsh
        env:
          PARITY_THUMBPRINT: ${{ steps.parity-cert.outputs.thumbprint }}
        run: |
          bun scripts/AgentRuntimeVerifier.ts `
            --agent apps/agent/dist/x64/pidex-agent.exe `
            --require-authenticode `
            --authenticode-trust-anchor $env:PARITY_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw "Signed agent runtime parity failed" }
      - name: Remove synthetic certificate and context
        if: always() && steps.run-context.outputs.created == 'true'
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.parity-cert.outputs.thumbprint }}
        run: |
          if ($env:CERT_THUMBPRINT) {
            # 只从 My 存储移除；根存储从未写入。
            $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            try {
              $found = @($store.Certificates | Where-Object { $_.Thumbprint -eq $env:CERT_THUMBPRINT })
              foreach ($c in $found) { $store.Remove($c) }
            } finally { $store.Close() }
          }
          bun scripts/ReleaseRunContext.ts dispose
          if ($LASTEXITCODE -ne 0) { throw "Failed to remove the synthetic signing context" }

  accessibility:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
          workspace: '@pidex/renderer'
      - name: Renderer final-state accessibility
        if: steps.project.outputs.run == 'true'
        run: bun run --cwd apps/desktop/renderer test:a11y --shard=${{ matrix.shard }}/2

  release-parity:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [signed-agent-parity, accessibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require signed runtime and accessibility checks
        env:
          SIGNED: ${{ needs.signed-agent-parity.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
        run: test "$SIGNED" = success && test "$ACCESSIBILITY" = success

  source-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: ${{ contains(github.ref_name, '-') && 'beta-release' || 'release' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag target belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$checked_out_commit"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
      - name: Version policy check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "codepilotx-dev/Pidex"
          bun run version:check -- --tag "$GITHUB_REF_NAME"
      - name: Build Windows x64 installer
        shell: bash
        run: bun run package:win
      - name: Silent install and installed-layout smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-installed-win-x64.ps1
      - name: Generate release notes and SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -LiteralPath release -Filter "Pidex-Desktop-*-x64.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer, found $($installers.Count)"
          }
          bun scripts/WriteReleaseNotes.ts --tag "$env:GITHUB_REF_NAME" --output release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate release notes" }
          $installer = $installers[0]
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$digest *$($installer.Name)" |
            Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Create GitHub Release with installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists and immutable releases must not be replaced" >&2
            exit 1
          fi

          release_args=(
            "$tag"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Pidex $tag"
            --notes-file release/RELEASE_NOTES.md
            release/Pidex-Desktop-*-x64.exe
            release/SHA256SUMS.txt
          )
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
