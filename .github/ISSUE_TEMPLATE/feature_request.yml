name: 功能建议
description: 提议一个有明确用户价值的新能力或改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和 Pull Request，未发现相同建议。
          required: true
        - label: 我描述的是用户问题，而不只是指定某个实现。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到什么阻碍？当前代价是什么？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述完成后的可观察行为或体验。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如有具体方案，请说明交互、数据流或 API 边界。
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明当前绕过方式，以及为什么不足。
  - type: dropdown
    id: area
    attributes:
      label: 主要范围
      options:
        - Desktop / Electron
        - Renderer / UI
        - Agent / Tools
        - Provider / Models
        - Protocol / Storage
        - Build / Release
        - Documentation / Governance
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险与约束
      description: 可填写兼容性、数据迁移、权限、隐私、性能或发布约束。
