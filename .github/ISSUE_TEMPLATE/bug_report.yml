name: 缺陷报告
description: 提交可复现的 Pidex 行为问题
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的报告。安全漏洞、凭据泄露或可直接利用的问题请使用私密安全报告入口，不要继续填写此表单。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 这不是安全漏洞，内容中不含 API key、令牌、证书或真实用户数据。
          required: true
  - type: input
    id: version
    attributes:
      label: Pidex 版本
      description: 可在应用关于或更新页面查看；源码构建请填写提交 SHA。
      placeholder: 0.2.0-beta.3 或 abc1234
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 环境
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明发生了什么，以及它如何影响你的工作。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 粘贴最小日志或截图。删除凭据、会话内容、用户数据和不必要的绝对路径。
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可填写模型 Provider、安装方式、是否稳定复现，以及已尝试的解决方法。
