name: Prepare Pidex CI
description: Skip documentation-only PR work and cache Bun downloads before installing.
inputs:
  install:
    description: Install workspace dependencies.
    default: 'true'
  ignore-scripts:
    description: Skip native lifecycle scripts for static checks.
    default: 'false'
outputs:
  run:
    description: Whether this change needs code validation.
    value: ${{ steps.scope.outputs.run }}
runs:
  using: composite
  steps:
    - name: Detect code changes
      id: scope
      shell: bash
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
          echo 'run=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
        changed="$(mktemp)"
        trap 'rm -f "$changed"' EXIT
        git diff --name-only -z "$CI_BASE_SHA" HEAD > "$changed"
        run=false
        while IFS= read -r -d '' file; do
          case "$file" in
            docs/*|README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|LICENSE|CHANGELOG.md) ;;
            *) run=true; break ;;
          esac
        done < "$changed"
        echo "run=$run" >> "$GITHUB_OUTPUT"
    - name: Setup Bun
      if: steps.scope.outputs.run == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: Restore Bun package downloads
      id: downloads
      if: steps.scope.outputs.run == 'true' && inputs.install == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'patches/**', 'vendor/extract-zip/**') }}
        restore-keys: bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.4-
    - name: Install dependencies
      if: steps.scope.outputs.run == 'true' && inputs.install == 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [[ "$IGNORE_SCRIPTS" == true ]]; then
          bun install --frozen-lockfile --ignore-scripts
        else
          bun install --frozen-lockfile
        fi
    - name: Save Bun package downloads
      if: steps.scope.outputs.run == 'true' && inputs.install == 'true' && steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.downloads.outputs.cache-primary-key }}
